  - cyber
  - it support
  - help ?desk
  - technician
  - nurs
  - pharmac
  - clinical
  exclude_season:
  - \bfall\b
  - \bspring\b
  - \bwinter\b
  - \bjanuary\b
  require_season_word_if_present: '2027'
