# jobbot configuration — edit freely; changes apply on the next run.
# Tier A keywords -> instant WhatsApp. Tier B -> one daily digest. Regexes are case-insensitive, matched on the job title.
# Add a company: copy its careers URL pattern into the right ATS block.
#   Workday URL  https://zebra.wd501.myworkdayjobs.com/Zebra_careers/...  -> host: zebra.wd501.myworkdayjobs.com, site: Zebra_careers
#   Greenhouse   job-boards.greenhouse.io/<token>/...                     -> greenhouse: {<token>: Company}
#   Lever        jobs.lever.co/<token>                                     -> lever: {<token>: Company}
#   Ashby        jobs.ashbyhq.com/<token>                                  -> ashby: {<token>: Company}
#   Oracle       <host>/hcmUI/CandidateExperience/en/sites/<site>/...      -> oracle: [{host, site, company}]
